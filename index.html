    <h1>Today's English Date</h1>

    <div class="today-bs-date">
      <div class="date-card" id="dateCard">
        <h2 id="currentDate"></h2>
        <p id="currentTime"></p>
    </div>
      <script type="text/javascript">
        var today = new Date();
        
        // Get current date components
        var dd = today.getDate();
        var mm = today.getMonth() + 1; // Months are zero-based
        var yyyy = today.getFullYear();
        var h = today.getHours();
        
        // Format hours to AM/PM
        var suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12;
        h = h ? h : 12; // the hour '0' should be '12'
        
        // Pad single digits with leading zeros
        if (dd < 10) {
            dd = '0' + dd;
        }
        if (mm < 10) {
            mm = '0' + mm;
        }
        
        // Construct the date and time strings
        var dateString = yyyy + '-' + mm + '-' + dd;
        var timeString = h + ' ' + suffix;
    
        // Display the date and time in the card
        document.getElementById('currentDate').innerText = dateString;

    </script>
